name: Refresh public market data
on:
  schedule:
    - cron: '37 10 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: public-data-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - run: npm test
      - name: Commit public datasets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official closing datasets'
            git push
          fi
      - name: Start Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref '${{ github.ref_name }}'
